apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-api-config
  namespace: notifications
data:
  PORT: "8080"
  MAX_ATTEMPTS: "3"
  RETRY_BASE_MS: "250"
  NATS_URL: "nats://nats:4222"
  REDIS_URL: "redis://redis:6379"
  DATABASE_URL: "postgresql://notifications:notifications@postgres:5432/notifications"
